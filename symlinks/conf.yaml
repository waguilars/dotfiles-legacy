- clean: ['~']

- defaults:
    link:
      create: true
      force: true

- create:
    - $DOTFILES_PATH/shell/bash/completions
    - $DOTFILES_PATH/shell/bash/themes

- link:
    ~/.bash_profile: shell/bash/.bash_profile
    ~/.bashrc: shell/bash/.bashrc
    ~/.zimrc: shell/zsh/.zimrc
    ~/.zlogin: shell/zsh/.zlogin
    ~/.zshenv: shell/zsh/.zshenv
    ~/.zshrc: shell/zsh/.zshrc
    ~/.inputrc: shell/.inputrc
    ~/.config/alacritty: shell/config/alacritty
    ~/.config/rofi: shell/config/rofi
    ~/.config/tilix: shell/config/tilix
    ~/.config/waybar: shell/config/waybar
    ~/.config/starship.toml: shell/config/starship.toml
    ~/.config/nvim: editors/nvim
    ~/.tldrrc: shell/config/.tldrrc
    ~/.tmux.conf: shell/config/.tmux.conf
    ~/.tmux.conf.local: shell/config/.tmux.conf.local
    ~/.gitconfig: git/gitconfig
