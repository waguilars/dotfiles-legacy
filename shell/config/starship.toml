# Inserts a blank line between shell prompts
add_newline = true

format = "$all"
right_format = "${custom.vpnlock}"

[directory]
truncation_length = 3
format = "[](yellow bold) [$path]($style)[$lock_symbol]($lock_style) "

[hostname]
ssh_only = false
format =  "  [$hostname]($style)  "
trim_at = ".wilsonaguilar.com"
disabled = false

[character]
success_symbol = "[ ➜](bold green)"
error_symbol = "[ ✖](bold red)"

[username]
format = "[  ](blue bold)"
disabled = false
show_always = true

[package]
disabled = true

# VPN a la derecha (no usar grep: alias grep=rg rompe el when)
[custom.vpnlock]
description = "OpenVPN status"
command = "bash -c '\"$HOME/.dotfiles/bin/vpn-starship\"'"
when = "bash -c '\"$HOME/.dotfiles/bin/vpn-starship\" --when'"
format = " [$output](bold green)"
ignore_timeout = true
